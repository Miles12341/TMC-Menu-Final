name: Build TMC
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
      - name: Build
        run: make package
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TMC-Package
          path: packages/*.deb
